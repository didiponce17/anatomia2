<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#1e6091" />
  <meta name="description" content="App de estudio de Anatomía Humana — Sistema Respiratorio y Digestivo, para preparar el parcial." />
  <title>Anatomía — Estudio inteligente</title>

  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
  />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- =========================================================== -->
  <!-- TOP BAR -->
  <!-- =========================================================== -->
  <header class="top-bar shadow-sm">
    <div class="container-fluid d-flex align-items-center justify-content-between py-2">
      <button
        class="btn btn-light btn-icon"
        type="button"
        data-bs-toggle="offcanvas"
        data-bs-target="#topicsDrawer"
        aria-controls="topicsDrawer"
        aria-label="Abrir menú de temas"
      >
        <span aria-hidden="true">☰</span>
      </button>
      <div class="text-center flex-grow-1 mx-2">
        <div class="app-title" id="appTopicTitle">Anatomía</div>
        <div class="app-subtitle small text-white-50" id="appSubtitle">Selecciona un tema</div>
      </div>
      <button
        class="btn btn-warning btn-icon"
        type="button"
        id="repasoButton"
        aria-label="Modo repaso rápido"
        title="Repaso rápido"
      >
        ⚡
      </button>
    </div>
    <!-- Progress -->
    <div class="progress-strip">
      <div class="progress-bar-wrap">
        <div class="progress-bar-fill" id="globalProgressBar" style="width: 0%"></div>
      </div>
      <div class="progress-label" id="globalProgressLabel">0 / 0 preguntas · 0 % aciertos</div>
    </div>
  </header>

  <!-- =========================================================== -->
  <!-- TOPICS OFFCANVAS / DRAWER -->
  <!-- =========================================================== -->
  <aside
    class="offcanvas offcanvas-start topics-drawer"
    tabindex="-1"
    id="topicsDrawer"
    aria-labelledby="topicsDrawerLabel"
  >
    <div class="offcanvas-header">
      <h2 class="offcanvas-title h5" id="topicsDrawerLabel">Temas</h2>
      <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Cerrar"></button>
    </div>
    <div class="offcanvas-body p-0">
      <ul class="list-group list-group-flush" id="topicsList" aria-label="Lista de temas"></ul>
      <div class="p-3 border-top text-center">
        <button class="btn btn-outline-danger btn-sm" id="resetProgressBtn">Reiniciar progreso</button>
      </div>
    </div>
  </aside>

  <!-- =========================================================== -->
  <!-- MAIN AREA -->
  <!-- =========================================================== -->
  <main class="container-fluid main-area" id="mainArea">
    <!-- HOME -->
    <section class="view view-home" id="homeView">
      <div class="hero">
        <h1 class="hero-title">Tu cerebro, paso a paso 🧠</h1>
        <p class="hero-sub">
          Aprende anatomía sin sobrecarga. Una idea a la vez.
          Empieza por el primer tema o continúa donde lo dejaste.
        </p>
        <button class="btn btn-primary btn-lg w-100" id="startStudyBtn">Comenzar a estudiar</button>
        <button class="btn btn-outline-secondary btn-lg w-100 mt-3" id="startQuickBtn">Repaso rápido</button>
      </div>

      <div class="card mt-4">
        <div class="card-body">
          <h2 class="h6 mb-3">💡 Puntos débiles detectados</h2>
          <ul class="small mb-0" id="weaknessList"></ul>
        </div>
      </div>
    </section>

    <!-- STUDY -->
    <section class="view view-study d-none" id="studyView" aria-live="polite"></section>

    <!-- QUIZ -->
    <section class="view view-quiz d-none" id="quizView" aria-live="polite"></section>

    <!-- REPASO -->
    <section class="view view-repaso d-none" id="repasoView" aria-live="polite"></section>
  </main>

  <!-- =========================================================== -->
  <!-- BOTTOM NAV -->
  <!-- =========================================================== -->
  <nav class="bottom-nav" aria-label="Modos">
    <button class="bottom-nav-btn active" data-mode="study" id="navStudy">
      <span class="icon" aria-hidden="true">📖</span>
      <span class="label">Estudio</span>
    </button>
    <button class="bottom-nav-btn" data-mode="quiz" id="navQuiz">
      <span class="icon" aria-hidden="true">📝</span>
      <span class="label">Quiz</span>
    </button>
    <button class="bottom-nav-btn" data-mode="repaso" id="navRepaso">
      <span class="icon" aria-hidden="true">⚡</span>
      <span class="label">Repaso</span>
    </button>
  </nav>

  <!-- =========================================================== -->
  <!-- TOAST / FEEDBACK -->
  <!-- =========================================================== -->
  <div class="feedback-toast" id="feedbackToast" role="status" aria-live="polite"></div>

  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"
  ></script>
  <script src="app.js"></script>
</body>
</html>
